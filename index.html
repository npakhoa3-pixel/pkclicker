<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>footprint clicker :)</title>
        <style>
            body {
                background-color: bisque;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                overflow: hidden;
            }
            .pk-img {
                border-radius: 50%;
                width: 100px;
                height: auto;

                transition: all 0.1s ease-in-out;
            }
            .pk-btn {
                border: none;
                background-color: bisque;
                border-radius: 50%;
            }
            .upgrade-bar {
                border-width: 10px;
                border-color: black;
                border: solid;
                background-color: blanchedalmond;
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 50px;

                display: flex;
                flex-direction: row;
                gap: 1%;
                align-items: center;
                justify-content: center;
            }
            .upgrade-btn {
                border:solid;
                border-radius: 10px;
                border-width: 1px;
                border-color: black;
                background-color: coral;
                height: 90%;
                width: 100px;

                transition: all 0.1s ease-in-out;
            }
            .dg {
                position: absolute;
                background-image: url("dg.jpg");
                background-size: cover;
                width: 75px;
                height: 50px;
                z-index: -1;
            }
            .who {
                position: absolute;
                background-image: url("who.jpg");
                background-size: cover;
                width: 125px;
                height: 75px;
                z-index: -1;
            }
            .fp {
                position: absolute;
                background-image: url("fp.jpg");
                background-size: cover;
                width: 100px;
                height: 100px;
                z-index: 1;

                transition: all 0.2s ;
            }
            .gay {
                position: absolute;
                opacity: 0.5;
                object-fit: contain;
                background-image: url("gay.jpg");
                background-size: cover;
                width: 100%;
                height: 100%;
                z-index: -2; 
            }
        </style>
    </head>
    <body>
        <h1 class = "maintext">0</h1>
        <button class = "pk-btn">
            <img src = "pk.jpg" class="pk-img">
        </button>
        <div class = "upgrade-bar"></div>
    </body>
    <script>
        const maintext = document.querySelector(".maintext");

        const mainbtn = document.querySelector(".pk-btn");
        const mainimg = document.querySelector(".pk-img");
        const upbar = document.querySelector(".upgrade-bar");

        const upgrades = ["digital footprint","who is ts","fat penguin","gay"];
        const pfp = ["pk.jpg","qu.jpg","tru.jpg","fp-img.jpg",]
        let multi = 1;
        const defprice = [10,50,1000,5000];
        const defamount = [1,0,0,0];

        const savedscore = localStorage.getItem("clicks")
        const savedprice = localStorage.getItem("upgrads")
        const savedamnt = localStorage.getItem("amnt")
        let price = [];
        let amount = [];
        let score = 0;
        let cps=0;
        if(savedscore !== null) {
            score = Number(savedscore);
            maintext.textContent = score
        }

        if(savedprice !== null) {
            price = JSON.parse(savedprice);
        }
        if(price.length===0) {
            price = defprice
        }

        function spawn(type) {
            let dgimg = document.createElement("div");
            dgimg.classList.add(type);

            document.body.appendChild(dgimg);
            let randomx = Math.random() * window.innerWidth
            let randomy = Math.random() * window.innerHeight
            dgimg.style.left = randomx + "px";
            dgimg.style.top = randomy + "px"
            if(type === "fp") {
                dgimg.addEventListener("click", function() {
                    score += 100 * multi;
                    maintext.textContent = score;
                })
                setInterval(function() {
                    let randomx = Math.random() * window.innerWidth
                    let randomy = Math.random() * window.innerHeight
                    dgimg.style.left = randomx + "px";
                    dgimg.style.top = randomy + "px"
                },500)
            }
            if(type === "gay") {
                dgimg.style.left = 0;
                dgimg.style.top = 0;
            }
        }

        if(savedamnt !== null) {
            amount = JSON.parse(savedamnt);
        }
        if(amount.length===0) {
            amount = defamount
        }
        for(let i = 0; i < upgrades.length; i++) {
            if(price[i] === undefined) {
                price[i] = defprice[i];
            }
            if(amount[i] === undefined) {
                amount[i] = defamount[i];
            }
        }
        for(let i = 0; i < amount[0]-1; i++) {
            spawn("dg");
        }
        for(let i = 0; i < amount[1]; i++) {
            spawn("who");
        }
        for(let i = 0; i < amount[2]; i++) {
            spawn("fp");
        }
        if(amount[3]===1) {
            multi += 0.25
            spawn("gay");
        }

        for(let i = 0; i < upgrades.length; i++) {
            let btn = document.createElement("button");
            btn.classList.add("upgrade-btn");
            if(i===3) {
                if(amount[3]===1) continue;
                btn.style.backgroundColor = "blue";
            }
            btn.textContent = upgrades[i] + " - " + price[i];
            btn.addEventListener("mouseenter",function() {
                btn.style.backgroundColor = "yellow";
            })
            btn.addEventListener("mouseleave",function() {
                if(i===3) {
                    btn.style.backgroundColor = "blue"
                } else {
                    btn.style.backgroundColor = "coral";
                }
            })
            btn.addEventListener("click",function() {
                if((score - price[i]) < 0) {
                    btn.textContent = "brokie";
                    setTimeout(function() {
                        btn.textContent = upgrades[i] + " - " + price[i];
                    },1000)
                    return;
                }
                score -= price[i];
                if(i===0) {
                    price[i] += 10;
                    spawn("dg");
                }
                if(i===1) {
                    price[i] += 20;
                    spawn("who");
                }
                if(i===2) {
                    price[i] += 500;
                    spawn("fp");
                }
                if(i===3) {
                    multi += 0.25
                    spawn("gay");
                    btn.remove();
                }
                amount[i]++;
                
                btn.textContent = upgrades[i] + " - " + price[i];
                maintext.textContent = score
            })

            upbar.appendChild(btn);
        }

        mainbtn.addEventListener("mouseenter", function() {
            mainimg.style.width = "110px";
        })
        mainbtn.addEventListener("mouseleave", function() {
            mainimg.style.width = "100px";
        })
        mainbtn.addEventListener("click",function() {
            let randi = Math.floor(Math.random() * pfp.length)
            mainimg.src = pfp[randi];

            mainimg.style.width = "90px";
            setTimeout(function() {
                mainimg.style.width = "110px";
            },100)
            score+=amount[0] * multi;
            maintext.textContent = score
        })

        setInterval(function() {
            score += amount[1] * multi;
            maintext.textContent = score
        },1000)
        setInterval(function() {
            if(score === 67) {
                maintext.textContent = "BOIIIII IT'S 6777777777"
            }
            if(score === 36) {
                maintext.textContent = "36 thanh hoa"
            }
            if(score === 367) {
                maintext.textContent = "367 SO THANH HOA BOIIIIIIIII"
            }
        },400)

        document.addEventListener("visibilitychange", function() {
            if(document.visibilityState === "hidden") {
                localStorage.setItem("clicks",score);
                localStorage.setItem("upgrads",JSON.stringify(price))
                localStorage.setItem("amnt",JSON.stringify(amount))
            }
        })
    </script>
</html>
